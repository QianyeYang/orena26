# LoRA SFT config — Qwen3-VL-4B-Instruct (SEGMENT track). Projector auto-detected.
base_path: os-models/Qwen3-VL-4B-Instruct
model_name: Qwen3-VL-4B-Instruct-lora
dtype: bfloat16
attn_implementation: sdpa

sampling:            # PARITY with the zero-shot baseline runner defaults —
  stride: 25         # keeps the SFT delta clean (no separate zero-shot rerun)
  max_frames: 64     # mean 50.8 frames/train Q -> ~13K prefill tokens
  max_pixels: 262144 # 960x540 -> 672x384 -> 252 tokens/frame
  min_pixels: null

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: null             # auto-discover LLM+vision nn.Linear leaves
  exclude_name_contains: [lm_head, embed_tokens]
  modules_to_save: null            # auto-detect projector (merger) to full-train

train:
  epochs: 12                       # cosine over 12; auto-resume spans 24h jobs
  per_device_batch_size: 1
  grad_accum: 16                   # eff. batch 16 (frame-track winning recipe)
  learning_rate: 1.0e-4
  lr_scheduler: cosine
  warmup_ratio: 0.03
  weight_decay: 0.0
  max_grad_norm: 1.0
  max_new_tokens: 64
  logging_steps: 10
  save_strategy: epoch
  dataloader_num_workers: 4
  seed: 42
  eval_n: 500                      # seeded test-subset size for per-epoch eval
