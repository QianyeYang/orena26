# LoRA SFT config — Qwen3-VL-4B-Instruct (PROCEDURE track). Projector auto-detected.
base_path: os-models/Qwen3-VL-4B-Instruct
model_name: Qwen3-VL-4B-Instruct-lora
dtype: bfloat16
attn_implementation: sdpa

sampling:            # REDUCED vs baseline defaults (128 @ 262144): training at a
  stride: 250        # ~33K-token context OOMs in backward on 96GB — the CE loss
  max_frames: 96     # materialises full logits (33K x 151K vocab ~ 10GB) + their
  max_pixels: 131072 # grad. 96 frames @ 131072 (120 tok/frame) -> ~11.8K tokens.
  min_pixels: null   # SFT delta measured vs a zero-shot rerun at THESE settings.

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: null             # auto-discover LLM+vision nn.Linear leaves
  exclude_name_contains: [lm_head, embed_tokens]
  modules_to_save: null            # auto-detect projector (merger) to full-train

train:
  epochs: 8                        # cosine over 8; auto-resume spans 24h jobs
  per_device_batch_size: 1
  grad_accum: 16                   # eff. batch 16 (frame-track winning recipe)
  learning_rate: 1.0e-4
  lr_scheduler: cosine
  warmup_ratio: 0.03
  weight_decay: 0.0
  max_grad_norm: 1.0
  max_new_tokens: 64
  logging_steps: 10
  save_strategy: epoch
  dataloader_num_workers: 4
  seed: 42
  eval_n: 500                      # seeded test-subset size for per-epoch eval
