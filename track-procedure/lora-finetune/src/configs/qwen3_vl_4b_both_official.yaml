# Fresh LoRA SFT from the original Qwen3-VL-4B base on both official datasets.
base_path: os-models/Qwen3-VL-4B-Instruct
run_name: Qwen3-VL-4B-Instruct-both-official
model_name: Qwen3-VL-4B-Instruct-lora-both-official
datasets: [heico, lapchole]
dtype: bfloat16
attn_implementation: sdpa

sampling:
  # Ten source-seconds per grid point, using each dataset's official native FPS.
  stride: {heico: 250, lapchole: 300}
  max_frames: 96
  max_pixels: 131072
  min_pixels: null

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: null
  exclude_name_contains: [lm_head, embed_tokens]
  modules_to_save: null

train:
  epochs: 8
  per_device_batch_size: 2
  grad_accum: 8
  auto_find_batch_size: true
  learning_rate: 1.0e-4
  lr_scheduler: cosine
  warmup_ratio: 0.03
  weight_decay: 0.0
  max_grad_norm: 1.0
  max_new_tokens: 64
  logging_steps: 10
  save_strategy: epoch
  dataloader_num_workers: 8
  # Avoid the PyTorch pin-thread/resource-sharer race seen on long B200 runs.
  dataloader_pin_memory: false
  dataloader_persistent_workers: true
  dataloader_prefetch_factor: 2
  optim: adamw_torch_fused
  tf32: true
  seed: 42
  eval_n: 500
