# LoRA SFT config — Qwen3-VL-4B-Instruct (FRAME track). Projector auto-detected.
base_path: os-models/Qwen3-VL-4B-Instruct
model_name: Qwen3-VL-4B-Instruct-lora
dtype: bfloat16
attn_implementation: sdpa
trust_remote_code: false

min_pixels: null
max_pixels: 602112                 # Qwen-VL family supports a pixel cap

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: null             # auto-discover LLM+vision nn.Linear leaves
  exclude_name_contains: [lm_head, embed_tokens]
  modules_to_save: null            # auto-detect projector (merger) to full-train

train:
  epochs: 30
  per_device_batch_size: 1
  grad_accum: 16
  learning_rate: 1.0e-4
  lr_scheduler: cosine
  warmup_ratio: 0.03
  weight_decay: 0.0
  max_grad_norm: 1.0
  max_new_tokens: 64
  logging_steps: 10
  save_strategy: epoch
  dataloader_num_workers: 4
  seed: 42
