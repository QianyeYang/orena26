# LoRA SFT config — InternVL3_5-8B (FRAME track). Needs trust_remote_code.
# Projector auto-detected (multi_modal_projector / mlp1).
base_path: os-models/InternVL3_5-8B
model_name: InternVL3_5-8B-lora
dtype: bfloat16
attn_implementation: sdpa
trust_remote_code: true

min_pixels: null
max_pixels: null                   # InternVL does its own dynamic tiling

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: null
  exclude_name_contains: [lm_head, embed_tokens]
  modules_to_save: null

train:
  epochs: 30
  per_device_batch_size: 1
  grad_accum: 16
  learning_rate: 1.0e-4
  lr_scheduler: cosine
  warmup_ratio: 0.03
  weight_decay: 0.0
  max_grad_norm: 1.0
  max_new_tokens: 64
  logging_steps: 10
  save_strategy: epoch
  dataloader_num_workers: 4
  seed: 42
