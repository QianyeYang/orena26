# FRAME v2 LoRA SFT on Qwen3-VL-4B-Instruct — the capacity control for the 27B.
#
# Everything that shapes the optimisation trajectory is held identical to
# qwen3_6_27b.yaml: same data, same prompts, same count balancing, same
# effective batch of 16, same LR and schedule, same epoch count. Only
# `per_device_batch_size`/`grad_accum` are re-split, and their product is
# unchanged — so both models take the *same number of optimizer steps per
# epoch* and the comparison is capacity, not training progress. The 4B simply
# finishes those steps in less wall-clock, which costs nothing because the runs
# occupy separate single-GPU nodes.
base_path: os-models/Qwen3-VL-4B-Instruct
run_name: Qwen3-VL-4B-frame-v2
model_name: Qwen3-VL-4B-frame-v2-lora
datasets: [heico, lapchole]
dtype: bfloat16
attn_implementation: sdpa
trust_remote_code: false

enable_thinking: false
prompt_strategy: v2

min_pixels: null
max_pixels: 602112

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: null
  exclude_name_contains: [lm_head, embed_tokens, mtp]
  modules_to_save: null

train:
  epochs: 8
  per_device_batch_size: 8       # 8 x 2 = 16, matching the 27B's 4 x 4
  grad_accum: 2
  learning_rate: 1.0e-4
  lr_scheduler: cosine
  warmup_ratio: 0.03
  weight_decay: 0.0
  max_grad_norm: 1.0
  logging_steps: 10
  save_strategy: epoch
  dataloader_num_workers: 8
  dataloader_pin_memory: false
  dataloader_persistent_workers: true
  dataloader_prefetch_factor: 2
  optim: adamw_torch_fused
  tf32: true
  seed: 42
  count_balance_power: 0.5
  count_balance_cap: 4
